<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accenture Pseudocode Mastery Exam</title>
<style>
body{margin:0;background:#0b1020;color:#f5f7fb;font:15px Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}
.top{position:sticky;top:0;background:#0b1020;padding:10px 0;display:flex;justify-content:space-between;gap:12px;z-index:5}
h1{font-size:23px;margin:0}.muted{color:#9aa4b2;font-size:13px}.timer{font-size:24px;font-weight:800;border:1px solid #303a55;border-radius:10px;padding:9px 14px}.warn{color:#ffb020}.danger{color:#ff6b6b}
.progress{height:7px;background:#202a42;border-radius:9px;margin:12px 0 18px}.bar{height:100%;background:#7c5cff;width:0}
.card{background:#141b2d;border:1px solid #2b3550;border-radius:15px;padding:20px}.meta{display:flex;justify-content:space-between}.badge{padding:5px 10px;border-radius:15px;background:#252e48}.easy{color:#61e6a4}.medium{color:#ffd166}.hard{color:#ff7d73}
pre{white-space:pre-wrap;background:#090e1b;border:1px solid #273149;border-radius:10px;padding:15px;line-height:1.5}.opts{display:grid;gap:9px;margin-top:15px}.opt{background:#10172a;color:#fff;border:1px solid #303a55;border-radius:10px;padding:13px;text-align:left;cursor:pointer}.selected{border-color:#7c5cff;background:#1d183d}
.actions{display:flex;justify-content:space-between;margin-top:18px;gap:10px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:#7c5cff;color:white}.secondary{background:#29334b;color:white}
.hidden{display:none}.score{font-size:40px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.stat{background:#0e1526;padding:12px;border-radius:9px;border:1px solid #29334b}.stat b{display:block;font-size:19px;margin-top:4px}.review div{padding:9px;border:1px solid #29334b;border-radius:8px;margin:7px 0}.ok{border-left:4px solid #32d583!important}.bad{border-left:4px solid #f97066!important}
button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.timer{font-size:20px}}
</style></head>
<body><div class="wrap">
<div id="exam"><div class="top"><div><h1>Accenture Pseudocode Mastery Exam</h1><div class="muted">30 questions • 45 minutes • one question at a time</div></div><div id="timer" class="timer">45:00</div></div>
<div class="progress"><div id="bar" class="bar"></div></div><div class="card">
<div class="meta"><b id="num"></b><span id="badge" class="badge"></span></div><p>What is the output?</p><pre id="code"></pre><div id="opts" class="opts"></div>
<div class="actions"><button id="prev" class="btn secondary">Previous</button><button id="next" class="btn primary">Submit & Next</button></div></div></div>
<div id="result" class="card hidden"></div></div>
<script>
const Q=[
["Easy","Variables","a=5\nb=3\na=a+b\nprint(a)",["8","2","5","15"],0],
["Easy","MOD","x=17\nprint(x MOD 5)",["1","2","3","4"],1],
["Easy","Condition","x=12\nif x MOD 2 == 0:\n print(\"A\")\nelse:\n print(\"B\")",["A","B","12","Error"],0],
["Easy","Loop","sum=0\nfor i=1 to 4:\n sum=sum+i\nprint(sum)",["6","8","10","12"],2],
["Easy","Loop","x=1\nfor i=1 to 3:\n x=x*2\nprint(x)",["4","6","8","16"],2],
["Easy","Array","a=[2,4,6,8]\nprint(a[1]+a[3])",["10","12","14","16"],1],
["Easy","String","s=\"ACCENTURE\"\nprint(length(s))",["7","8","9","10"],2],
["Easy","Nested loop","c=0\nfor i=1 to 2:\n for j=1 to 3:\n  c=c+1\nprint(c)",["3","5","6","8"],2],
["Easy","Increment","x=4\nx=x+1\nx=x*3\nprint(x)",["12","15","16","18"],1],
["Easy","Division","x=19\nprint(x DIV 4)",["3","4","4.75","5"],0],
["Medium","Bitwise AND","a=13\nb=9\nprint(a AND b)",["4","8","9","13"],0],
["Medium","Bitwise XOR","a=12\nb=17\nprint(a XOR b)",["21","25","29","31"],1],
["Medium","Bitwise OR","a=10\nb=5\nprint(a OR b)",["10","12","15","20"],2],
["Medium","Nested loop","c=0\nfor i=1 to 3:\n for j=1 to i:\n  c=c+1\nprint(c)",["5","6","7","9"],1],
["Medium","MOD loop","c=0\nfor i=1 to 10:\n if i MOD 3 == 0:\n  c=c+1\nprint(c)",["2","3","4","5"],1],
["Medium","Array traversal","a=[3,1,4,1,5]\ns=0\nfor x in a:\n if x>2: s=s+x\nprint(s)",["9","10","12","13"],3],
["Medium","Function","function f(x):\n return x*2+1\nprint(f(4)+f(2))",["10","12","14","16"],2],
["Medium","Recursion","function f(n):\n if n==0: return 1\n return n*f(n-1)\nprint(f(4))",["12","16","20","24"],3],
["Medium","String loop","s=\"HELLO\"\nc=0\nfor ch in s:\n if ch==\"L\": c=c+1\nprint(c)",["1","2","3","4"],1],
["Medium","Condition","x=7\ny=4\nif x>5 AND y<5:\n print(x+y)\nelse:\n print(x-y)",["3","11","28","1"],1],
["Hard","State simulation","x=2\ny=3\nfor i=1 to 4:\n x=x+y\n y=y+1\nprint(x)",["18","20","22","24"],3],
["Hard","Nested condition","x=18\nif x MOD 2==0:\n if x MOD 3==0: print(x/3)\n else: print(x*2)\nelse: print(x+1)",["6","9","12","36"],0],
["Hard","Recursion","function f(n):\n if n<=1: return 1\n return f(n-1)+f(n-2)\nprint(f(5))",["5","8","13","21"],2],
["Hard","Bitwise","x=6\ny=3\nprint((x XOR y) + (x AND y))",["3","5","7","9"],2],
["Hard","Array frequency","a=[2,3,2,4,2,3]\nc=0\nfor x in a:\n if x==2: c=c+1\nprint(c)",["2","3","4","5"],1],
["Hard","Loop jump","s=0\ni=1\nwhile i<10:\n s=s+i\n i=i*2\nprint(s)",["7","15","16","31"],1],
["Hard","Multiple variables","a=5\nb=2\nfor i=1 to 3:\n a=a+b\n b=b+1\nprint(a+b)",["14","16","18","20"],3],
["Hard","Number reversal","n=123\nr=0\nwhile n>0:\n d=n MOD 10\n r=r*10+d\n n=n DIV 10\nprint(r)",["123","213","312","321"],3],
["Hard","Logical operators","a=8\nb=5\nif (a>5 OR b>7) AND NOT(a<0):\n print(a-b)\nelse:\n print(a+b)",["3","13","40","0"],0],
["Hard","Recursive sum","function f(n):\n if n==0: return 0\n return n+f(n-2)\nprint(f(7))",["9","12","16","21"],3]
].map(x=>({level:x[0],topic:x[1],code:x[2],opts:x[3],ans:x[4]}));
let i=0,answers=Array(Q.length).fill(null),times=Array(Q.length).fill(0),started=Date.now(),deadline=started+2700000,qStart=started,finished=false;
const $=id=>document.getElementById(id),fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function tick(){if(finished)return;let r=Math.max(0,Math.ceil((deadline-Date.now())/1000));$("timer").textContent=fmt(r);$("timer").className="timer "+(r<=120?"danger":r<=300?"warn":"");if(r===0)finish(true)}
setInterval(tick,200);
function render(){let q=Q[i];$("num").textContent=`Question ${i+1} / ${Q.length}`;$("badge").textContent=q.level;$("badge").className="badge "+q.level.toLowerCase();$("code").textContent=q.code;let o=$("opts");o.innerHTML="";q.opts.forEach((v,k)=>{let b=document.createElement("button");b.className="opt"+(answers[i]===k?" selected":"");b.textContent=String.fromCharCode(65+k)+") "+v;b.onclick=()=>{answers[i]=k;render()};o.appendChild(b)});$("prev").disabled=i===0;$("next").textContent=i===Q.length-1?"Submit Exam":"Submit & Next";$("bar").style.width=((i+1)/Q.length*100)+"%"}
$("next").onclick=()=>{if(answers[i]===null){alert("Select an answer before submitting.");return}times[i]+=(Date.now()-qStart)/1000;if(i===Q.length-1)finish(false);else{i++;qStart=Date.now();render()}};
$("prev").onclick=()=>{if(i){times[i]+=(Date.now()-qStart)/1000;i--;qStart=Date.now();render()}};
function finish(auto){if(finished)return;finished=true;times[i]+=(Date.now()-qStart)/1000;let total=(Date.now()-started)/1000,correct=Q.reduce((n,q,k)=>n+(answers[k]===q.ans),0),pct=Math.round(correct/Q.length*100),avg=times.reduce((a,b)=>a+b,0)/Q.length;
let lev={Easy:[0,0],Medium:[0,0],Hard:[0,0]};Q.forEach((q,k)=>{lev[q.level][1]++;if(answers[k]===q.ans)lev[q.level][0]++});
let topic={};Q.forEach((q,k)=>{topic[q.topic]??=[0,0];topic[q.topic][1]++;if(answers[k]===q.ans)topic[q.topic][0]++});
let weak=Object.entries(topic).filter(x=>x[1][0]<x[1][1]).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).slice(0,5);
let slow=Q.map((q,k)=>({k,q,t:times[k]})).sort((a,b)=>b.t-a.t).slice(0,5);
let status=pct>=80?"STRONG":pct>=60?"BORDERLINE":"NEEDS PRACTICE";
let result={date:new Date().toISOString(),score:correct,total:Q.length,percent:pct,status,totalSeconds:Math.round(total),averageSeconds:Math.round(avg),levels:lev,topic,answers};
let hist=JSON.parse(localStorage.getItem("accenture_pseudocode_history")||"[]");hist.push(result);hist=hist.slice(-50);localStorage.setItem("accenture_pseudocode_history",JSON.stringify(hist));
$("exam").classList.add("hidden");$("result").classList.remove("hidden");
$("result").innerHTML=`<h2>Final Evaluation</h2><div class="score">${correct}/${Q.length} — ${pct}%</div><p><b>Status:</b> ${status}${auto?" — time limit reached":""}</p>
<div class="grid"><div class="stat">Total time<b>${fmt(total)}</b></div><div class="stat">Average/question<b>${Math.round(avg)}s</b></div><div class="stat">Answered<b>${answers.filter(x=>x!==null).length}</b></div><div class="stat">Target<b>80%+</b></div></div>
<h3>Difficulty</h3><p>Easy ${lev.Easy[0]}/${lev.Easy[1]} · Medium ${lev.Medium[0]}/${lev.Medium[1]} · Hard ${lev.Hard[0]}/${lev.Hard[1]}</p>
<h3>Weak topics</h3><p>${weak.length?weak.map(x=>x[0]+" ("+x[1][0]+"/"+x[1][1]+")").join(" · "):"No weak topic detected."}</p>
<h3>Slowest questions</h3><div class="review">${slow.map(x=>`<div>Q${x.k+1} · ${x.q.topic} · ${Math.round(x.t)}s</div>`).join("")}</div>
<h3>Question review</h3><div class="review">${Q.map((q,k)=>{let ok=answers[k]===q.ans;return `<div class="${ok?"ok":"bad"}"><b>Q${k+1} ${ok?"✓":"✗"}</b> · ${q.level} · ${q.topic}<br>Your: ${answers[k]===null?"Not answered":String.fromCharCode(65+answers[k])} · Correct: ${String.fromCharCode(65+q.ans)}</div>`}).join("")}</div>
<button class="btn primary" onclick="exportResult()">Export This Result</button> <button class="btn secondary" onclick="exportHistory()">Export All Attempts</button> <button class="btn secondary" onclick="location.reload()">Retake</button>
<h3>Saved attempts on this device: ${hist.length}</h3>`;
}
function download(name,data){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportResult(){let h=JSON.parse(localStorage.getItem("accenture_pseudocode_history")||"[]");download("accenture-pseudocode-latest-result.json",JSON.stringify(h[h.length-1]||{},null,2))}
function exportHistory(){download("accenture-pseudocode-history.json",localStorage.getItem("accenture_pseudocode_history")||"[]")}
render();
</script></body></html>
